name: Bug Report
description: Report a problem with Nu.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Please answer each question below to the best of your ability.
        It's okay to leave some blank if it doesn't apply to your problem.
  - type: input
    attributes:
      label: What were you trying to do?
    validations:
      required: false
  - type: textarea
    attributes:
      label: What steps did you take to trigger the issue?
    validations:
      required: false
  - type: input
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    attributes:
      label: What actually happened?
    validations:
      required: false
  - type: input
    attributes:
      label: Operating System Version
    validations:
      required: false
  - type: input
    attributes:
      label: Nu Version
      description: Shown in the window title, e.g. 2.0.0.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Other Info
      description: You can put any info here that you think might help us track down the bug.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Editor Log
      description: |
        If Nu crashed, paste the details from its crash window (**Copy to
        clipboard**) here.

        Otherwise, please paste **Nu's log**: click the cog icon in the bottom
        right of the editor window, click in the log, then Ctrl-A to select
        all, Ctrl-C to copy and Ctrl-V to paste it here (Cmd on a Mac).
        If Nu doesn't open, the log files (`mu.log`; the folder name comes from
        Mu) are in:
        * Windows: `%LOCALAPPDATA%\python\mu\Logs`
        * macOS: `~/Library/Logs/mu`
        * Linux: `~/.local/state/mu/log`
    validations:
      required: false
  - type: markdown
    attributes:
      value: Thank you for helping to improve Nu! :-)