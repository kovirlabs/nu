name: Build installers

# Native installers via Briefcase (Phase 4d, see TODO.md). One runner per OS:
#   windows -> .msi   macOS -> zipped .app (ad-hoc signed)   linux -> .AppImage
#
# Installers are built on a version tag (`vX.Y.Z`) or a manual run, NOT on
# every push — tests run separately in test.yml. On a tag, the `release` job
# publishes a GitHub Release with the installers attached. Release versions are
# plain numeric X.Y.Z: Windows MSI versions can't carry a pre-release segment
# (Briefcase strips it, so 2.0.0b3 and 2.0.0 are the same MSI version). Test
# installers from a manual run first; ship fixes as the next patch (X.Y.Z+1).
# A non-numeric tag still publishes, as a GitHub pre-release.
#
# Signing (Authenticode / Apple notarization) is deferred — users will see a
# SmartScreen / Gatekeeper warning until secrets are wired in (TODO.md 4d).

on:
  workflow_dispatch:
  push:
    tags: 'v*'

# Minimal default token scope; the `release` job widens this to
# `contents: write` for itself to publish the GitHub Release.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runs-on }}
    # Bound a hung packaging step (macOS dmg historically hangs on headless
    # runners) so it fails fast instead of needing a manual cancel.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows MSI
            briefcase-version: 0.4.5
            runs-on: windows-latest
            briefcase-platform: windows
            briefcase-format: ''
            docker-arg: ''
            package-args: ''
            artifact-glob: dist/*.msi
          # Apple Silicon (arm64): GitHub is retiring the Intel (macos-13)
          # runners, which left this job stuck waiting for one. arm64 runners are
          # reliable and native on every modern Mac. The baseline wheels are
          # fetched arch-aware (see os_compatibility_flags), so they match.
          # Package as a zipped .app — the dmg path uses Finder/AppleScript and
          # hangs on headless CI.
          - label: macOS app
            briefcase-version: 0.4.2
            runs-on: macos-latest
            briefcase-platform: macOS
            briefcase-format: ''
            docker-arg: ''
            package-args: '--adhoc-sign --packaging-format zip'
            artifact-glob: dist/*.zip
          # --no-docker: Briefcase's Docker (manylinux) image has no compatible
          # PyQt6-QScintilla wheel and falls back to a source build that dies at
          # qmake. Building against the host (with the Qt libs installed below)
          # uses the normal binary wheels.
          - label: Linux AppImage
            briefcase-version: 0.4.2
            runs-on: ubuntu-latest
            briefcase-platform: linux
            briefcase-format: appimage
            docker-arg: '--no-docker'
            package-args: '--no-docker'
            artifact-glob: dist/*.AppImage
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # For the --no-docker AppImage, linuxdeploy bundles the Qt6 platform
      # plugin's shared libraries from the host, so they must be present.
      - name: Install Linux Qt6 runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      # Briefcase is pinned per platform (matrix `briefcase-version`) so a new
      # release can't silently break or alter the installers. Bump deliberately
      # after a green manual run.
      # - Windows needs >= 0.4.5: earlier MSI templates have no <MajorUpgrade>,
      #   so a new installer would install alongside the old one instead of
      #   replacing it. 0.4.5 adds it with AllowSameVersionUpgrades (the betas
      #   were all stamped 2.0.0, since MSI versions are numeric-only).
      # - macOS/Linux stay on 0.4.2: 0.4.5's AppImage template fails with
      #   "'collections.OrderedDict object' has no attribute 'host_arch'".
      # uv is only used by the next step, to look up the CPython download.
      - name: Install Briefcase
        run: python -m pip install --upgrade pip briefcase==${{ matrix.briefcase-version }} uv

      # Bundle what the first launch needs so it works offline: the baseline
      # wheels zip (pgzero/pygame/ipykernel + deps, mu/wheels/<version>.zip)
      # plus a relocatable CPython and a pip wheel (mu/wheels/python/) that the
      # learner's environment is built from.
      - name: Build offline baseline wheels and Python
        run: python -m mu.wheels --package

      - name: Briefcase create
        run: briefcase create ${{ matrix.briefcase-platform }} ${{ matrix.briefcase-format }} ${{ matrix.docker-arg }}

      - name: Briefcase build
        run: briefcase build ${{ matrix.briefcase-platform }} ${{ matrix.briefcase-format }} ${{ matrix.docker-arg }}

      - name: Briefcase package
        run: briefcase package ${{ matrix.briefcase-platform }} ${{ matrix.briefcase-format }} ${{ matrix.package-args }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: nu-editor-${{ runner.os }}-${{ github.sha }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # Run on tag pushes even if a platform's build failed (always()), so a beta
    # still ships whatever installers did build.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub release with installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # A clean final release is digits-and-dots only (vX.Y.Z). Any PEP 440
          # pre/dev segment (b1, rc1, .dev1, a 1.0.0-beta0.1-style tag, ...)
          # publishes as a GitHub pre-release.
          if [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            prerelease=""
          else
            prerelease="--prerelease"
          fi
          gh release create "$tag" --title "nu $tag" --generate-notes $prerelease
          # -exec ... {} + tolerates the spaces in the installer filenames.
          find artifacts -type f -exec gh release upload "$tag" {} +
