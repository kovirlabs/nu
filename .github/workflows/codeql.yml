name: "CodeQL"

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
  schedule:
    - cron: "3 2 * * 2"

jobs:
  analyze:
    timeout-minutes: 20
    name: Analyze
    # ubuntu-20.04 runners are retired: jobs pinned to them queue until
    # GitHub cancels them, so the scheduled scans never ran.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner's own Python is externally managed (PEP 668), so pip
      # can't install into it; use a setup-python one, as the other
      # workflows do. Qt is only installed, never imported, so no system
      # libraries are needed.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies to help the code scanner
        run: pip install ./plugins/circuitpython ./plugins/pygamezero ".[dev]"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml
          queries: +security-and-quality
          # Dependencies are installed manually above (pip install ... .[dev]); skip
          # CodeQL's own dependency auto-install.
          setup-python-dependencies: false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
